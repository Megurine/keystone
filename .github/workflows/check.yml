# Keystone on macOS, Windows and Linux: scripts parse, the example decks serve and render, screenshots, publishing.
name: check
on:
  push:
  pull_request:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node tools/smoke.mjs
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
