<!doctype html>

<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — $site</title>
<meta name="description" content="$description">
<meta property="og:type" content="website">
<meta property="og:site_name" content="$site">
<meta property="og:url" content="$url/talks/$slug/">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:image" content="$url/talks/$slug/og.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="672">
<meta property="og:image:alt" content="$title, a talk by $author">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/public/assets/brand/sa-monogram-white.svg" type="image/svg+xml">
<link rel="stylesheet" href="/public/reader/reader.css">
<script type="module" src="/public/reader/reader.js"></script>
</head>
<body class="talk-page">

<!-- Generated by Keystone tools/deploy.mjs from public/reader/talk.html. Edit the template, not this file. -->
<aside class="rail talk-rail" aria-label="Chapter">
  <a class="rail-logo" href="/"><img src="/public/assets/brand/sa-monogram-white.svg" alt="$site"></a>
  <p class="rail-verb" aria-live="polite"><span class="rail-built" hidden>$railPrefix</span><span class="rail-word"></span></p>
</aside>
<main class="talk" data-talk="/talks/$slug/">
  <h1 class="visually-hidden">$title — a talk by $author</h1>
  <div class="talk-stage" tabindex="-1" aria-label="Slides. Use the arrow keys or swipe to move."></div>
  <a class="talk-close" href="/talks/" aria-label="Close the talk">✕</a>
  <nav class="talk-bar mono" aria-label="Slide navigation">
    <button type="button" data-step="-1" aria-label="Previous slide">←</button>
    <span class="talk-count" aria-live="polite">01 / 00</span>
    <button type="button" data-step="1" aria-label="Next slide">→</button>
    <span class="talk-bar-sep"></span>
    <a class="talk-lang" hidden></a>
    <button type="button" class="talk-overview-open" aria-label="Overview (O)">Overview</button>
    <button type="button" class="talk-fullscreen">Full screen</button>
  </nav>
  <p class="talk-warning" hidden><b class="mono"></b> <span></span></p>
</main>

</body>
</html>
